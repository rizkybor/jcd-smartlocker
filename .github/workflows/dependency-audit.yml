name: Dependency Audit

# SMB-905 (docs/Epics-Smartbox.md Epic 9) — pagar kerentanan dependency di
# CI, saling melengkapi dengan Dependabot (.github/dependabot.yml) yang
# hanya membuka PR update, bukan menggagalkan CI berjalan.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # setiap Senin 03:00 UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --prod --audit-level=critical: gerbang keras cuma untuk kerentanan
      # PROD paling parah. Saat ditulis ada beberapa high (mis. multer/lodash
      # transitif lewat @nestjs/*) yang belum ada patch tanpa upgrade major
      # NestJS — itu ditangani lewat PR Dependabot mingguan, bukan gerbang
      # keras di sini (supaya CI tidak merah terus-menerus tanpa aksi yang
      # bisa diambil sekarang). SMB-905.
      - name: pnpm audit — prod, critical
        run: pnpm audit --prod --audit-level=critical

      - name: pnpm audit — laporan lengkap (informational)
        if: always()
        run: pnpm audit --audit-level=moderate || true
