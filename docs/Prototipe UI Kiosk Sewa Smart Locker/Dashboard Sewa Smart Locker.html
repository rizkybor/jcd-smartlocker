<style>
html,body{margin:0;height:100%;background:var(--sl-surface-page)}
#root{height:100%}
a{color:var(--sl-text-link)}a:hover{color:var(--sl-text-link-hover)}
.dsx-app{display:flex;height:100vh;overflow:hidden;font-family:var(--sl-font-body)}
.dsx-app>nav>div:first-child{min-height:88px!important;justify-content:center}
.dsx-app>nav>div:first-child>span{display:none}
.dsx-app>nav>div:first-child>img{height:44px!important}
.dsx-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.dsx-top{flex:none;height:88px;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 24px;background:var(--sl-surface-card);border-bottom:1px solid var(--sl-border)}
.dsx-crumb{display:flex;align-items:center;gap:8px;font-size:var(--sl-fs-14);color:var(--sl-text-muted)}
.dsx-crumb strong{font-family:var(--sl-font-display);font-weight:var(--sl-fw-semibold);color:var(--sl-text-strong)}
.dsx-sep{color:var(--sl-n-300)}
.dsx-user{display:flex;align-items:center;gap:12px;font-size:var(--sl-fs-14);color:var(--sl-text-body)}
.dsx-userlines{display:flex;flex-direction:column;gap:2px;line-height:1.25}
.dsx-username{font:var(--sl-fw-bold) var(--sl-fs-16)/1.25 var(--sl-font-display);color:var(--sl-text-strong)}
.dsx-usermeta{font-size:var(--sl-fs-13);color:var(--sl-text-muted)}
.dsx-avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:var(--sl-radius-pill);background:var(--sl-primary-tint);color:var(--sl-primary);font:var(--sl-fw-bold) var(--sl-fs-14)/1 var(--sl-font-display)}
.dsx-logout{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;padding:0 12px;border:1px solid rgba(255,255,255,.24);border-radius:var(--sl-radius-sm);background:transparent;color:#fff;font:var(--sl-fw-semibold) var(--sl-fs-14)/1 var(--sl-font-body);cursor:pointer}
.dsx-logout:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4)}
.dsx-rolechip{padding:4px 12px;border-radius:var(--sl-radius-pill);background:var(--sl-accent-tint);color:var(--sl-accent);font:var(--sl-fw-semibold) var(--sl-fs-12)/1.4 var(--sl-font-body)}
.dsx-rolechip.super{background:var(--sl-primary-tint);color:var(--sl-primary)}
.dsx-scopechip{padding:4px 12px;border-radius:var(--sl-radius-pill);background:var(--sl-n-100);color:var(--sl-text-muted);font-size:var(--sl-fs-12);font-weight:var(--sl-fw-semibold)}
.dsx-sidefoot strong{color:#fff;font-weight:var(--sl-fw-semibold)}
.dsx-content{flex:1;overflow:auto}
.dsx-page{max-width:var(--sl-container-max);margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:24px}
.dsx-pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.dsx-h1{margin:0;font:var(--sl-fw-bold) var(--sl-fs-24)/1.2 var(--sl-font-display);color:var(--sl-text-strong);letter-spacing:var(--sl-ls-tight)}
.dsx-desc{margin:6px 0 0;font-size:var(--sl-fs-14);color:var(--sl-text-muted)}
.dsx-actions{display:flex;gap:12px}.dsx-actions button{white-space:nowrap}
.dsx-grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.dsx-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.dsx-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:1180px){.dsx-grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.dsx-grid3,.dsx-grid2{grid-template-columns:1fr}}
.dsx-mono{font-family:var(--sl-font-mono);font-size:var(--sl-fs-13);letter-spacing:.02em;color:var(--sl-text-body)}
.dsx-note{font-size:var(--sl-fs-13);color:var(--sl-text-muted);padding:0 4px}
.dsx-occ{display:flex;flex-direction:column;gap:4px;min-width:160px}
.dsx-occval{font:var(--sl-fw-semibold) var(--sl-fs-14)/1 var(--sl-font-display);color:var(--sl-text-strong);font-variant-numeric:tabular-nums}
.dsx-occval--off{color:var(--sl-text-faint);font-weight:var(--sl-fw-medium)}
.dsx-occtrack{height:6px;border-radius:var(--sl-radius-pill);background:var(--sl-n-100);overflow:hidden}
.dsx-occfill{display:block;height:100%;border-radius:var(--sl-radius-pill);background:var(--sl-secondary)}
.dsx-occnote{font-size:var(--sl-fs-12);color:var(--sl-text-muted)}
.dsx-chart{position:relative;height:220px;padding:8px 0 0 44px}
.dsx-bar.peak{background:var(--sl-primary);opacity:1}
.dsx-chartgrid{position:absolute;left:0;top:8px;bottom:28px;width:40px;display:flex;flex-direction:column;justify-content:space-between;font-size:var(--sl-fs-11);color:var(--sl-text-faint);text-align:right;font-variant-numeric:tabular-nums}
.dsx-bars{display:flex;align-items:flex-end;gap:6px;height:calc(100% - 28px);border-bottom:1px solid var(--sl-border);border-left:1px solid var(--sl-border);padding:0 4px}
.dsx-bar{flex:1;min-width:6px;border-radius:var(--sl-radius-xs) var(--sl-radius-xs) 0 0;background:var(--sl-secondary);opacity:.85}
.dsx-bar.peak{background:var(--sl-primary);opacity:1}
.dsx-chartaxis{display:flex;justify-content:space-between;padding:8px 4px 0;font-size:var(--sl-fs-11);color:var(--sl-text-faint)}
.dsx-tfoot{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%}

.dsx-ph{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.dsx-phtag{padding:2px 8px;border-radius:var(--sl-radius-xs);background:var(--sl-accent-tint);color:var(--sl-accent);font:var(--sl-fw-bold) var(--sl-fs-11)/1.4 var(--sl-font-body);text-transform:uppercase;letter-spacing:var(--sl-ls-caps)}
.dsx-phbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--sl-border-strong);border-radius:var(--sl-radius-md);background:var(--sl-n-25);text-align:center;padding:16px}
.dsx-phlabel{font-family:var(--sl-font-display);font-size:var(--sl-fs-14);font-weight:var(--sl-fw-semibold);color:var(--sl-text-muted)}
.dsx-phnote{font-size:var(--sl-fs-12);color:var(--sl-text-faint);max-width:420px}

.dsx-range{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.dsx-rangefields{display:flex;flex-direction:row;align-items:flex-end;gap:16px;width:100%;box-sizing:border-box}
@media(min-width:900px){.dsx-rangefields{width:auto;flex:1}}
.dsx-rangebtn{display:flex;gap:12px;margin-left:auto}
.dsx-select{height:40px;padding:0 12px;border-radius:var(--sl-radius-sm);border:1px solid var(--sl-border);background:var(--sl-surface-card);color:var(--sl-text-body);font:var(--sl-fw-medium) var(--sl-fs-14)/1 var(--sl-font-body);box-shadow:var(--sl-elev-inset);cursor:pointer}
.dsx-select:focus-visible{outline:none;box-shadow:0 0 0 4px var(--sl-focus, rgba(124,58,237,.35));border-color:var(--sl-secondary)}
.dsx-rowactions{display:inline-flex;gap:8px;justify-content:flex-end}
.dsx-taglist{display:inline-flex;flex-wrap:wrap;gap:6px}
.dsx-tag{padding:3px 10px;border-radius:var(--sl-radius-pill);background:var(--sl-primary-tint);color:var(--sl-primary);font-size:var(--sl-fs-12);font-weight:var(--sl-fw-semibold)}

.dsx-configtop{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.dsx-unitmeta{display:flex;align-items:center;gap:12px}
.dsx-metalabel{font-size:var(--sl-fs-12);text-transform:uppercase;letter-spacing:var(--sl-ls-caps);color:var(--sl-text-faint);font-weight:var(--sl-fw-bold)}
.dsx-stepper{display:flex;align-items:center;gap:16px}
.dsx-steppernum{min-width:88px;text-align:center;font:var(--sl-fw-bold) var(--sl-fs-30)/1 var(--sl-font-display);color:var(--sl-text-strong);font-variant-numeric:tabular-nums}
.dsx-steppernote{font-size:var(--sl-fs-13);color:var(--sl-text-muted)}
.dsx-togglelist{display:flex;flex-direction:column;gap:16px}
.dsx-togglerow{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px;border:1px solid var(--sl-border);border-radius:var(--sl-radius-md);background:var(--sl-surface-card)}
.dsx-toggletitle{font:var(--sl-fw-semibold) var(--sl-fs-16)/1.3 var(--sl-font-display);color:var(--sl-text-strong)}
.dsx-hw{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:var(--sl-fs-13)}
.dsx-hw.ok{color:var(--sl-status-available-strong)}
.dsx-hw.bad{color:var(--sl-status-offline-strong)}
.dsx-hwdot{width:8px;height:8px;border-radius:var(--sl-radius-pill);background:currentColor}
.dsx-switch{position:relative;width:56px;height:32px;flex:none;padding:0;border:1px solid var(--sl-border-strong);border-radius:var(--sl-radius-pill);background:var(--sl-n-100);cursor:pointer;transition:background var(--sl-dur-fast) var(--sl-ease-standard),border-color var(--sl-dur-fast) var(--sl-ease-standard)}
.dsx-switch.on{background:var(--sl-secondary);border-color:var(--sl-secondary)}
.dsx-knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:var(--sl-radius-pill);background:#fff;box-shadow:var(--sl-elev-1);transition:transform var(--sl-dur-fast) var(--sl-ease-standard)}
.dsx-switch.on .dsx-knob{transform:translateX(24px)}
.dsx-switch:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(124,58,237,.35)}

.dsx-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.dsx-multilabel{margin:20px 0 8px;font:var(--sl-fw-semibold) var(--sl-fs-13)/1 var(--sl-font-body);color:var(--sl-text-body)}
.dsx-req{margin-left:6px;color:var(--sl-status-offline-strong);font-weight:var(--sl-fw-medium)}
.dsx-multi{display:flex;flex-wrap:wrap;gap:12px}
.dsx-chip{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:var(--sl-radius-sm);border:1px solid var(--sl-border);background:var(--sl-surface-card);color:var(--sl-text-body);font:var(--sl-fw-medium) var(--sl-fs-14)/1 var(--sl-font-body);cursor:pointer}
.dsx-chip.on{border-color:var(--sl-secondary);background:var(--sl-secondary-tint);color:var(--sl-primary);font-weight:var(--sl-fw-semibold)}
.dsx-icon{display:block;flex:none}
.dsx-check{display:grid;place-items:center;width:18px;height:18px;border-radius:var(--sl-radius-xs);border:1px solid var(--sl-border-strong);background:#fff;font-size:12px;color:var(--sl-secondary)}
.dsx-chip.on .dsx-check{border-color:var(--sl-secondary)}
.dsx-hint{margin-top:10px;font-size:var(--sl-fs-13);color:var(--sl-text-muted)}
.dsx-err{margin-top:10px;font-size:var(--sl-fs-13);color:var(--sl-status-offline-strong);font-weight:var(--sl-fw-semibold)}
.dsx-formfoot{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}
.dsx-overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(11,27,69,.45);animation:dsx-fade var(--sl-dur-base) var(--sl-ease-standard)}
.dsx-modal{width:100%;max-width:640px;max-height:88vh;overflow:auto}
@keyframes dsx-fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.dsx-overlay{animation-duration:1ms}}
.dsx-statuspick{display:grid;gap:12px}
.dsx-statusopt{display:flex;align-items:center;gap:16px;padding:14px 16px;border:1px solid var(--sl-border);border-radius:var(--sl-radius-sm);background:var(--sl-surface-card);cursor:pointer;text-align:left}
.dsx-statusopt:hover{border-color:var(--sl-border-strong);background:var(--sl-n-25)}
.dsx-statusopt.on{border-color:var(--sl-secondary);background:var(--sl-secondary-tint);box-shadow:0 0 0 1px var(--sl-secondary)}
.dsx-statushint{font-size:var(--sl-fs-13);color:var(--sl-text-muted)}
.dsx-empty{padding:32px;text-align:center;font-size:var(--sl-fs-14);color:var(--sl-text-muted);border:1px dashed var(--sl-border-strong);border-radius:var(--sl-radius-md);background:var(--sl-n-25)}
.dsx-iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--sl-border);border-radius:var(--sl-radius-sm);background:var(--sl-surface-card);color:var(--sl-text-muted);cursor:pointer}
.dsx-iconbtn:hover{border-color:var(--sl-secondary);color:var(--sl-secondary);background:var(--sl-secondary-tint)}
.dsx-detailfilter{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.dsx-filternote{margin-top:12px;font-size:var(--sl-fs-13);color:var(--sl-text-muted)}
.dsx-dd{position:relative;display:flex;flex-direction:column;gap:6px}
.dsx-ddlabel{font-size:var(--sl-fs-13);font-weight:var(--sl-fw-semibold);color:var(--sl-text-body)}
.dsx-ddbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:40px;padding:0 12px;background:var(--sl-surface-card);border:var(--sl-border-w) solid var(--sl-border-strong);border-radius:var(--sl-radius-sm);box-shadow:var(--sl-elev-inset);font:var(--sl-fw-medium) var(--sl-fs-14)/1 var(--sl-font-body);color:var(--sl-text-strong);cursor:pointer}
.dsx-ddbtn .dsx-icon{color:var(--sl-text-muted);transition:transform var(--sl-dur-fast) var(--sl-ease-standard)}
.dsx-ddbtn.open{border-color:var(--sl-secondary)}
.dsx-ddbtn.open .dsx-icon{transform:rotate(180deg)}
.dsx-ddmenu{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:5;display:flex;flex-direction:column;padding:4px;background:var(--sl-surface-card);border:var(--sl-border-w) solid var(--sl-border);border-radius:var(--sl-radius-sm);box-shadow:var(--sl-elev-3)}
.dsx-ddopt{padding:10px 12px;border:0;border-radius:var(--sl-radius-xs);background:none;text-align:left;font:var(--sl-fw-medium) var(--sl-fs-14)/1 var(--sl-font-body);color:var(--sl-text-body);cursor:pointer}
.dsx-ddopt:hover{background:var(--sl-n-100)}
.dsx-ddopt.on{background:var(--sl-secondary-tint);color:var(--sl-primary);font-weight:var(--sl-fw-semibold)}
.dsx-detailhead{display:flex;gap:48px;padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--sl-border)}
.dsx-detailhead>div{display:flex;flex-direction:column;gap:6px}
.dsx-detailval{font:var(--sl-fw-bold) var(--sl-fs-20)/1 var(--sl-font-display);color:var(--sl-text-strong);font-variant-numeric:tabular-nums}

.dsx-scope{display:flex;align-items:flex-start;gap:16px;padding:16px 20px;border:1px solid var(--sl-border);border-left:4px solid var(--sl-primary);border-radius:var(--sl-radius-md);background:var(--sl-primary-tint)}
.dsx-scopelock{display:flex;color:var(--sl-primary);margin-top:2px}
.dsx-scopetitle{font:var(--sl-fw-bold) var(--sl-fs-16)/1.3 var(--sl-font-display);color:var(--sl-primary)}
.dsx-scopeline{display:flex;align-items:center;gap:8px;font-size:var(--sl-fs-13);color:var(--sl-text-muted);padding:0 4px}
.dsx-metric{display:flex;flex-direction:column;gap:var(--sl-space-3);padding:var(--sl-space-5) var(--sl-space-6);background:var(--sl-surface-card);border:var(--sl-border-w) solid var(--sl-border);border-top:3px solid var(--sl-border);border-radius:var(--sl-radius-md);box-shadow:var(--sl-elev-1)}
.dsx-metric.tappable{cursor:pointer}
.dsx-metric.tappable:hover{box-shadow:var(--sl-elev-2)}
.dsx-metriclabel{font-size:var(--sl-fs-12);font-weight:var(--sl-fw-semibold);letter-spacing:var(--sl-ls-caps);text-transform:uppercase;color:var(--sl-text-muted)}
.dsx-metricvalue{font:var(--sl-fw-bold) var(--sl-fs-30)/1.1 var(--sl-font-display);color:var(--sl-text-strong);font-variant-numeric:tabular-nums}
.dsx-metricdesc{font-size:var(--sl-fs-13);color:var(--sl-text-body)}
.dsx-metricdesc.muted{color:var(--sl-text-muted)}
.dsx-metricdesc.down{color:var(--sl-status-offline)}
.dsx-metricfoot{display:flex;align-items:center;justify-content:space-between;gap:var(--sl-space-3);flex-wrap:wrap;margin-top:auto}
.dsx-unitstate{display:inline-flex;align-items:center;gap:10px}
.dsx-statedot{width:12px;height:12px;border-radius:var(--sl-radius-pill)}
.dsx-statedot.ok{background:var(--sl-status-available)}
.dsx-statedot.bad{background:var(--sl-status-offline)}
.dsx-unitnote.ok{color:var(--sl-status-available-strong);font-weight:var(--sl-fw-semibold)}
.dsx-unitnote.bad{color:var(--sl-status-offline);font-weight:var(--sl-fw-regular)}
.dsx-cardlink{padding:0;border:0;background:none;font:var(--sl-fw-semibold) var(--sl-fs-12)/1.2 var(--sl-font-body);color:var(--sl-text-link);cursor:pointer;white-space:nowrap}
.dsx-cardlink:hover{color:var(--sl-text-link-hover);text-decoration:underline}
.dsx-periodchip{display:inline-block;padding:2px 10px;border-radius:var(--sl-radius-pill);background:var(--sl-border);color:var(--sl-text-muted);font-size:var(--sl-fs-12);font-weight:var(--sl-fw-semibold)}
.dsx-scopesub{margin-top:4px;font-size:var(--sl-fs-13);color:var(--sl-text-body);max-width:820px}

.dsx-reporthead{display:flex;align-items:flex-start;justify-content:space-between;gap:32px;padding-bottom:20px;border-bottom:1px solid var(--sl-border);flex-wrap:wrap}
.dsx-repeyebrow{font:var(--sl-fw-bold) var(--sl-fs-11)/1 var(--sl-font-body);text-transform:uppercase;letter-spacing:var(--sl-ls-caps);color:var(--sl-text-faint)}
.dsx-reptitle{margin-top:8px;font:var(--sl-fw-bold) var(--sl-fs-20)/1.2 var(--sl-font-display);color:var(--sl-text-strong)}
.dsx-repmeta{margin-top:4px;font-size:var(--sl-fs-13);color:var(--sl-text-muted)}
.dsx-repid{display:grid;gap:6px;font-size:var(--sl-fs-12)}
.dsx-repid>div{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.dsx-repid span:first-child{color:var(--sl-text-faint);text-transform:uppercase;letter-spacing:var(--sl-ls-caps);font-weight:var(--sl-fw-bold)}
.dsx-repsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding-top:20px}
.dsx-repsum--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.dsx-warnbar{display:flex;align-items:center;gap:12px;margin-top:20px;padding:12px 16px;border-radius:var(--sl-radius-sm);background:var(--sl-status-offline-tint);color:var(--sl-status-offline-strong);font-size:var(--sl-fs-13);font-weight:var(--sl-fw-semibold)}
.dsx-exportbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.dsx-exportbtn{display:flex;gap:12px}
.dsx-mark-0 tbody tr:nth-child(1)>td,.dsx-mark-1 tbody tr:nth-child(2)>td,.dsx-mark-2 tbody tr:nth-child(3)>td{background:var(--sl-secondary-tint)!important}
.dsx-repcell{display:flex;flex-direction:column;gap:8px;padding-right:24px;border-right:1px solid var(--sl-border)}
