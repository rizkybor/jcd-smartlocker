<meta charset="utf-8"><title>Kiosk components</title><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:var(--sl-surface-card)}#root{display:block}.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sl-text-faint);margin:0 0 10px}</style>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
window.SL_ICON_BASE = "../../assets/icons";
const { KioskButton, Numpad, CompartmentCard, StepProgress, QRScreen, IdleScreen, Icon } = window.SewaSmartLockerDesignSystem_2be940;
function Demo(){
  const [pin,setPin]=React.useState("42");
  const [pick,setPick]=React.useState("A-04");
  return (<div style={{display:"grid",gap:28}}>
    <div><p className="lbl">KioskButton — tones & sizes</p>
      <div style={{display:"flex",gap:20,flexWrap:"wrap",alignItems:"flex-end"}}>
        <KioskButton tone="primary" size="xl" icon={<Icon name="package" size={56} />}>Sewa Loker</KioskButton>
        <KioskButton tone="secondary" size="lg" icon={<Icon name="lock-open" size={48} />}>Buka Pintu</KioskButton>
        <KioskButton tone="neutral" size="lg" icon={<Icon name="chevron-left" size={48} />}>Kembali</KioskButton>
        <KioskButton tone="success" size="md">Selesai</KioskButton>
        <KioskButton tone="danger" size="md">Batal</KioskButton>
        <KioskButton tone="primary" size="md" disabled>Nonaktif</KioskButton>
      </div></div>
    <div><p className="lbl">StepProgress</p><StepProgress steps={["Pilih Loker","Durasi","Pembayaran","Kode Akses"]} current={2} /></div>
    <div><p className="lbl">CompartmentCard</p>
      <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
        <CompartmentCard id="A-04" state="available" size="m" meta="Rp 15.000 / 3 jam" onClick={()=>setPick("A-04")} selected={pick==="A-04"} />
        <CompartmentCard id="A-05" state="occupied" size="m" meta="Sampai 18:30" />
        <CompartmentCard id="A-06" state="offline" size="l" meta="Tiket #2291" />
        <CompartmentCard id="B-01" state="available" size="xl" meta="Rp 25.000 / 3 jam" onClick={()=>setPick("B-01")} selected={pick==="B-01"} />
      </div></div>
    <div style={{display:"flex",gap:32,flexWrap:"wrap",alignItems:"flex-start"}}>
      <div style={{flex:"1 1 300px"}}><p className="lbl">Numpad</p><Numpad value={pin} onChange={setPin} length={6} mask label="Masukkan PIN loker Anda" /></div>
      <div style={{flex:"1 1 300px"}}><p className="lbl">QRScreen</p><QRScreen qrSize={240} title="Scan untuk Bayar" subtitle="QRIS · e-wallet atau m-banking" amount="Rp 15.000" secondsLeft={296} /></div>
    </div>
    <div><p className="lbl">IdleScreen</p><IdleScreen style={{minHeight:360,borderRadius:"var(--sl-radius-lg)"}} logoSrc="../../assets/logo-mono-light.png" logoHeight={64}
      stats={[{value:"12",label:"Loker tersedia"},{value:"Rp 15.000",label:"Mulai / 3 jam"}]} /></div>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
