<meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--sl-surface-card);font-family:var(--sl-font-body)}.r{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}.sw{border-radius:var(--sl-radius-md);padding:12px;min-width:132px;flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:104px}.nm{font-size:12px;font-weight:700;letter-spacing:.02em}.hx{font-family:var(--sl-font-mono);font-size:11px;opacity:.85;margin-top:18px}.v{font-family:var(--sl-font-mono);font-size:10px;opacity:.7}.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sl-text-faint);margin:0 0 10px}</style><div class="r"><div class="sw" style="background:var(--sl-status-available-tint);color:var(--sl-status-available-strong);border:2px solid var(--sl-status-available)"><div class="nm" style="font-size:18px">Tersedia</div><div><div class="hx">#15803D on tint</div><div class="v">--sl-status-available-strong</div></div></div><div class="sw" style="background:var(--sl-status-occupied-tint);color:var(--sl-status-occupied-strong);border:2px solid var(--sl-status-occupied)"><div class="nm" style="font-size:18px">Terisi</div><div><div class="hx">#A16207 on tint</div><div class="v">--sl-status-occupied-strong</div></div></div><div class="sw" style="background:var(--sl-status-offline-tint);color:var(--sl-status-offline-strong);border:2px solid var(--sl-status-offline)"><div class="nm" style="font-size:18px">Offline</div><div><div class="hx">#B91C1C on tint</div><div class="v">--sl-status-offline-strong</div></div></div></div><div style="margin-top:10px;font-size:11px;color:var(--sl-text-muted)">#EAB308 fails contrast as text. Yellow is a <b>fill</b> colour only; the word "Terisi" is always #A16207.</div>
